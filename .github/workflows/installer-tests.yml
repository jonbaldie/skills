name: Installer tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: >-
          bash -n install.sh tests/*.sh
          skills/sync-jonbaldie-skills/scripts/*.sh
      - name: Lint installer scripts
        run: >-
          shellcheck -e SC2016 install.sh
          $(find tests -type f -name '*.sh' ! -name 'install-ship-spec.sh' -print)
          skills/sync-jonbaldie-skills/scripts/*.sh
      - name: Run all test suites
        run: tests/run-all.sh
